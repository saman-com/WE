services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: we
      POSTGRES_PASSWORD: we_dev
      POSTGRES_DB: we_platform
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./databases/identity/init.sql:/docker-entrypoint-initdb.d/01-create-we-identity.sql:ro
      - ./databases/organisation/init.sql:/docker-entrypoint-initdb.d/02-create-we-organisation.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U we -d we_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: we
      RABBITMQ_DEFAULT_PASS: we_dev
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5

  sample-service:
    build:
      context: ./examples/sample-service
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  identity-service:
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__IdentityDb: Host=postgres;Port=5432;Database=we_identity;Username=we;Password=we_dev
      Jwt__Issuer: we-platform-identity
      Jwt__Audience: we-platform
      Jwt__Key: ${JWT_KEY:-local-dev-only-change-in-production-32chars}
    depends_on:
      postgres:
        condition: service_healthy

  organisation-service:
    build:
      context: .
      dockerfile: services/organisation-service/Dockerfile
    ports:
      - "8082:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__OrganisationDb: Host=postgres;Port=5432;Database=we_organisation;Username=we;Password=we_dev
      Jwt__Issuer: we-platform-identity
      Jwt__Audience: we-platform
      Jwt__Key: ${JWT_KEY:-local-dev-only-change-in-production-32chars}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
