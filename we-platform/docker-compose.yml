services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    command: ["postgres", "-c", "max_connections=800"]
    environment:
      POSTGRES_USER: we
      POSTGRES_PASSWORD: we_dev
      POSTGRES_DB: we_platform
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./databases/identity/init.sql:/docker-entrypoint-initdb.d/01-create-we-identity.sql:ro
      - ./databases/organisation/init.sql:/docker-entrypoint-initdb.d/02-create-we-organisation.sql:ro
      - ./databases/curriculum/init.sql:/docker-entrypoint-initdb.d/03-create-we-curriculum.sql:ro
      - ./databases/learning/init.sql:/docker-entrypoint-initdb.d/04-create-we-learning.sql:ro
      - ./databases/assessment/init.sql:/docker-entrypoint-initdb.d/05-create-we-assessment.sql:ro
      - ./databases/evidence/init.sql:/docker-entrypoint-initdb.d/06-create-we-evidence.sql:ro
      - ./databases/diagnostic/init.sql:/docker-entrypoint-initdb.d/07-create-we-diagnostic.sql:ro
      - ./databases/gaps/init.sql:/docker-entrypoint-initdb.d/08-create-we-gaps.sql:ro
      - ./databases/mastery/init.sql:/docker-entrypoint-initdb.d/09-create-we-mastery.sql:ro
      - ./databases/interventions/init.sql:/docker-entrypoint-initdb.d/10-create-we-interventions.sql:ro
      - ./databases/ei/init.sql:/docker-entrypoint-initdb.d/11-create-we-ei.sql:ro
      - ./databases/ai-gateway/init.sql:/docker-entrypoint-initdb.d/12-create-we-ai-gateway.sql:ro
      - ./databases/communication/init.sql:/docker-entrypoint-initdb.d/13-create-we-communication.sql:ro
      - ./databases/reporting/init.sql:/docker-entrypoint-initdb.d/14-create-we-reporting.sql:ro
      - ./databases/edw/init.sql:/docker-entrypoint-initdb.d/15-create-we-edw.sql:ro
      - ./databases/configuration/init.sql:/docker-entrypoint-initdb.d/16-create-we-configuration.sql:ro
      - ./databases/federation/init.sql:/docker-entrypoint-initdb.d/17-create-we-federation.sql:ro
      - ./databases/national-reporting/init.sql:/docker-entrypoint-initdb.d/18-create-we-national-reporting.sql:ro
      - ./databases/notification/init.sql:/docker-entrypoint-initdb.d/19-create-we-notifications.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U we -d we_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    # Includes rabbitmq_delayed_message_exchange (required for MassTransit UseDelayedRedelivery).
    image: heidiks/rabbitmq-delayed-message-exchange:3.13.3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: we
      RABBITMQ_DEFAULT_PASS: we_dev
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5

  sample-service:
    build:
      context: .
      dockerfile: examples/sample-service/Dockerfile
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  identity-service:
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__IdentityDb: Host=postgres;Port=5432;Database=we_identity;Username=we;Password=we_dev;Maximum Pool Size=30;Timeout=15
      Jwt__Issuer: we-platform-identity
      Jwt__Audience: we-platform
      Jwt__Key: ${JWT_KEY:-local-dev-only-change-in-production-32chars}
      Organisation__BaseUrl: http://organisation-service:8080
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      organisation-service:
        condition: service_healthy

