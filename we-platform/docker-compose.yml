services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: we
      POSTGRES_PASSWORD: we_dev
      POSTGRES_DB: we_platform
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./databases/identity/init.sql:/docker-entrypoint-initdb.d/01-create-we-identity.sql:ro
      - ./databases/organisation/init.sql:/docker-entrypoint-initdb.d/02-create-we-organisation.sql:ro
      - ./databases/curriculum/init.sql:/docker-entrypoint-initdb.d/03-create-we-curriculum.sql:ro
      - ./databases/learning/init.sql:/docker-entrypoint-initdb.d/04-create-we-learning.sql:ro
      - ./databases/assessment/init.sql:/docker-entrypoint-initdb.d/05-create-we-assessment.sql:ro
      - ./databases/evidence/init.sql:/docker-entrypoint-initdb.d/06-create-we-evidence.sql:ro
      - ./databases/diagnostic/init.sql:/docker-entrypoint-initdb.d/07-create-we-diagnostic.sql:ro
      - ./databases/gaps/init.sql:/docker-entrypoint-initdb.d/08-create-we-gaps.sql:ro
      - ./databases/mastery/init.sql:/docker-entrypoint-initdb.d/09-create-we-mastery.sql:ro
      - ./databases/interventions/init.sql:/docker-entrypoint-initdb.d/10-create-we-interventions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U we -d we_platform"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: we
      RABBITMQ_DEFAULT_PASS: we_dev
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5

  sample-service:
    build:
      context: ./examples/sample-service
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  identity-service:
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__IdentityDb: Host=postgres;Port=5432;Database=we_identity;Username=we;Password=we_dev
      Jwt__Issuer: we-platform-identity
      Jwt__Audience: we-platform
      Jwt__Key: ${JWT_KEY:-local-dev-only-change-in-production-32chars}
    depends_on:
      postgres:
        condition: service_healthy

  organisation-service:
    build:
      context: .
      dockerfile: services/organisation-service/Dockerfile
    ports:
      - "8082:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__OrganisationDb: Host=postgres;Port=5432;Database=we_organisation;Username=we;Password=we_dev
      Jwt__Issuer: we-platform-identity
      Jwt__Audience: we-platform
      Jwt__Key: ${JWT_KEY:-local-dev-only-change-in-production-32chars}
      StudentLearning__BaseUrl: http://student-learning-service:8080
    depends_on:
      postgres:
        condition: service_healthy

  curriculum-service:
    build:
      context: .
      dockerfile: services/curriculum-service/Dockerfile
    ports:
      - "8083:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__CurriculumDb: Host=postgres;Port=5432;Database=we_curriculum;Username=we;Password=we_dev
      Jwt__Issuer: we-platform-identity
      Jwt__Audience: we-platform
      Jwt__Key: ${JWT_KEY:-local-dev-only-change-in-production-32chars}
    depends_on:
      postgres:
        condition: service_healthy

  student-learning-service:
    build:
      context: .
      dockerfile: services/student-learning-service/Dockerfile
    ports:
      - "8084:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__StudentLearningDb: Host=postgres;Port=5432;Database=we_learning;Username=we;Password=we_dev
      Organisation__BaseUrl: http://organisation-service:8080
      Jwt__Issuer: we-platform-identity
      Jwt__Audience: we-platform
      Jwt__Key: ${JWT_KEY:-local-dev-only-change-in-production-32chars}
    depends_on:
      postgres:
        condition: service_healthy
      organisation-service:
        condition: service_started

  assessment-service:
    build:
      context: .
      dockerfile: services/assessment-service/Dockerfile
    ports:
      - "8085:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__AssessmentDb: Host=postgres;Port=5432;Database=we_assessment;Username=we;Password=we_dev
      Organisation__BaseUrl: http://organisation-service:8080
      Jwt__Issuer: we-platform-identity
      Jwt__Audience: we-platform
      Jwt__Key: ${JWT_KEY:-local-dev-only-change-in-production-32chars}
    depends_on:
      postgres:
        condition: service_healthy
      organisation-service:
        condition: service_started

  evidence-service:
    build:
      context: .
      dockerfile: services/evidence-service/Dockerfile
    ports:
      - "8086:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__EvidenceDb: Host=postgres;Port=5432;Database=we_evidence;Username=we;Password=we_dev
      Organisation__BaseUrl: http://organisation-service:8080
      StudentLearning__BaseUrl: http://student-learning-service:8080
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: we
      RabbitMQ__Password: we_dev
      Jwt__Issuer: we-platform-identity
      Jwt__Audience: we-platform
      Jwt__Key: ${JWT_KEY:-local-dev-only-change-in-production-32chars}
    depends_on:
      postgres:
        condition: service_healthy
      organisation-service:
        condition: service_started
      student-learning-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  event-subscriber-service:
    build:
      context: .
      dockerfile: services/event-subscriber-service/Dockerfile
    ports:
      - "8087:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: we
      RabbitMQ__Password: we_dev
    depends_on:
      rabbitmq:
        condition: service_healthy

  diagnostic-service:
    build:
      context: .
      dockerfile: services/diagnostic-service/Dockerfile
    ports:
      - "8088:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DiagnosticDb: Host=postgres;Port=5432;Database=we_diagnostic;Username=we;Password=we_dev
      Organisation__BaseUrl: http://organisation-service:8080
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: we
      RabbitMQ__Password: we_dev
      Jwt__Issuer: we-platform-identity
      Jwt__Audience: we-platform
      Jwt__Key: ${JWT_KEY:-local-dev-only-change-in-production-32chars}
    depends_on:
      postgres:
        condition: service_healthy
      organisation-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  learning-gap-service:
    build:
      context: .
      dockerfile: services/learning-gap-service/Dockerfile
    ports:
      - "8089:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__GapDb: Host=postgres;Port=5432;Database=we_gaps;Username=we;Password=we_dev
      Organisation__BaseUrl: http://organisation-service:8080
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: we
      RabbitMQ__Password: we_dev
      Jwt__Issuer: we-platform-identity
      Jwt__Audience: we-platform
      Jwt__Key: ${JWT_KEY:-local-dev-only-change-in-production-32chars}
    depends_on:
      postgres:
        condition: service_healthy
      organisation-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  mastery-service:
    build:
      context: .
      dockerfile: services/mastery-service/Dockerfile
    ports:
      - "8090:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__MasteryDb: Host=postgres;Port=5432;Database=we_mastery;Username=we;Password=we_dev
      Organisation__BaseUrl: http://organisation-service:8080
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Username: we
      RabbitMQ__Password: we_dev
      Jwt__Issuer: we-platform-identity
      Jwt__Audience: we-platform
      Jwt__Key: ${JWT_KEY:-local-dev-only-change-in-production-32chars}
    depends_on:
      postgres:
        condition: service_healthy
      organisation-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  ei-service:
    build:
      context: .
      dockerfile: services/ei-service/Dockerfile
    ports:
      - "8091:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Organisation__BaseUrl: http://organisation-service:8080
      Mastery__BaseUrl: http://mastery-service:8080
      Gaps__BaseUrl: http://learning-gap-service:8080
      Diagnostics__BaseUrl: http://diagnostic-service:8080
      Jwt__Issuer: we-platform-identity
      Jwt__Audience: we-platform
      Jwt__Key: ${JWT_KEY:-local-dev-only-change-in-production-32chars}
    depends_on:
      organisation-service:
        condition: service_started
      mastery-service:
        condition: service_started
      learning-gap-service:
        condition: service_started
      diagnostic-service:
        condition: service_started

  ai-gateway-service:
    build:
      context: .
      dockerfile: services/ai-gateway-service/Dockerfile
    ports:
      - "8093:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Prompts__RootPath: /app/prompts
      AiProvider__Provider: Mock
      Jwt__Issuer: we-platform-identity
      Jwt__Audience: we-platform
      Jwt__Key: ${JWT_KEY:-local-dev-only-change-in-production-32chars}

  intervention-service:
    build:
      context: .
      dockerfile: services/intervention-service/Dockerfile
    ports:
      - "8092:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__InterventionDb: Host=postgres;Port=5432;Database=we_interventions;Username=we;Password=we_dev
      Organisation__BaseUrl: http://organisation-service:8080
      Jwt__Issuer: we-platform-identity
      Jwt__Audience: we-platform
      Jwt__Key: ${JWT_KEY:-local-dev-only-change-in-production-32chars}
    depends_on:
      postgres:
        condition: service_healthy
      organisation-service:
        condition: service_started

volumes:
  postgres_data:
