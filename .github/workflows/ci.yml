name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

defaults:
  run:
    working-directory: we-platform

jobs:
  backend:
    name: .NET build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore WePlatform.sln

      - name: Build
        run: dotnet build WePlatform.sln --no-restore -c Release

      - name: Test
        run: dotnet test WePlatform.sln --no-build -c Release --verbosity normal
        env:
          # Evidence approval flow tests use Testcontainers (Docker).
          TESTCONTAINERS_RYUK_DISABLED: "true"

  frontend:
    name: Next.js build and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: we-platform/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: we-platform
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: we-platform/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --filter e2e exec playwright install chromium --with-deps

      - name: Copy portal env
        run: cp apps/web-portal/.env.local.example apps/web-portal/.env.local

      - name: Start stack, seed, and run e2e
        run: pnpm e2e
        env:
          CI: "true"
          E2E_HEALTH_TIMEOUT: "480"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            we-platform/testing/e2e/playwright-report
            we-platform/testing/e2e/test-results
          retention-days: 14
